[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carwise-rag"
version = "0.1.0"
description = "Evidence-based vehicle comparison and retrieval-augmented research assistant"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "numpy>=1.26,<3",
  "pydantic>=2,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
sync = ["playwright>=1.50,<2"]

[project.scripts]
carwise-ingest = "carwise.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["carwise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

